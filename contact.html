  <meta charset="UTF-8">

  <style>
    @font-face{font-family:"Comfortaa-Bold";src:url("fonts/Comfortaa-Bold.ttf") format("truetype");font-display:swap}
    @font-face{font-family:"OpenSans-Light";src:url("fonts/OpenSans-Light.ttf") format("truetype");font-display:swap}
    :root{--ink:#162F43;--accent:#58BABB;--accent-pink:#E92575;--ink-soft:#333333;--muted:#7F8D98;--rule:#82A2AD;--bg:#FFFFFF}
    *,*::before,*::after{box-sizing:border-box}
    html,body,h1,p,form,label,input,textarea,button{margin:0;padding:0}
    html{font-size:100%;-webkit-text-size-adjust:100%}
    body{line-height:1}
    img{border:0;max-width:100%;display:block}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    body{background:var(--bg);color:var(--ink);font-family:"OpenSans-Light",system-ui,sans-serif;font-size:1.0625rem;line-height:1.75}
    .wrapper{max-width:960px;margin:0 auto;padding:0 1.25rem}
    h1{font-family:"Comfortaa-Bold",sans-serif;font-size:1.875rem;line-height:1.2;color:var(--ink);margin-bottom:1.25rem}
    p{margin-bottom:1.25rem}
    p:last-child{margin-bottom:0}
    a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--ink)}
    .site-header{padding:1.75rem 0 1.5rem;margin-bottom:2.5rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
    .logo-link{display:inline-block;text-decoration:none}
    .logo-link img{display:block}
    .site-nav{display:flex;align-items:center;gap:1.25rem}
    .site-nav>a{font-family:"OpenSans-Light",system-ui,sans-serif;font-size:.9375rem;color:var(--ink);text-decoration:none;border:1px solid var(--rule);padding:.4rem 1.125rem;white-space:nowrap}
    .site-nav>a:hover{border-color:var(--accent);color:var(--accent)}
    .social-icons{list-style:none;display:flex;align-items:center;gap:.5rem}
    .social-icons li{margin:0}
    .social-icons a{display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:var(--rule);text-decoration:none}
    .social-icons a:hover{background:var(--accent)}
    .social-icons img{width:15px;height:15px;display:block}
    .contact-intro{max-width:680px;margin-bottom:2rem}
    .contact-form{max-width:680px}
    .form-field{display:flex;flex-direction:column;margin-bottom:1rem}
    .form-field label{font-family:"OpenSans-Light",system-ui,sans-serif;font-size:.875rem;color:var(--muted);margin-bottom:.3rem}
    .form-field .optional{font-size:.8125rem;color:var(--muted)}
    .form-field input,.form-field textarea{font-family:"OpenSans-Light",system-ui,sans-serif;font-size:1rem;color:var(--ink);background:#fff;border:1px solid var(--rule);padding:.5rem .625rem;line-height:1.5;width:100%;-webkit-appearance:none;border-radius:0}
    .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--accent)}
    .form-field textarea{resize:vertical;min-height:8rem}
    .form-submit{background:var(--accent-pink);color:#fff;border:0;font-family:"OpenSans-Light",system-ui,sans-serif;font-size:1rem;padding:.625rem 1.75rem;cursor:pointer;margin-top:.5rem;border-radius:0}
    .form-submit:hover{background:#c91e65}
    .form-submit:disabled{opacity:.6;cursor:default}
    .site-footer{border-top:1px solid var(--rule);padding:1.5rem 0 2rem;margin-top:3rem}
    .site-footer p{font-size:.875rem;color:var(--muted)}
    .site-footer a{color:var(--muted);text-decoration:none}
    .site-footer a:hover{color:var(--ink)}
    @media(min-width:640px){h1{font-size:2.25rem}.wrapper{padding:0 2rem}.site-header{padding:2.5rem 0 2rem;margin-bottom:3rem}}
  </style>
</head>

  <div class="wrapper">

    <header class="site-header">
      <a href="/" class="logo-link">
        <img src="images/MIG_LOGO_POS_RGB_VSML_F.png" alt="Miggle" width="160" height="105" loading="eager">
      </a>
      <nav class="site-nav">
        <ul class="social-icons">
          <li><a href="https://www.linkedin.com/in/alickmighall/" aria-label="LinkedIn" target="_blank" rel="noopener"><img src="images/linkedin.svg" alt="LinkedIn" width="15" height="15"></a></li>
          <li><a href="https://medium.com/miggle" aria-label="Medium" target="_blank" rel="noopener"><img src="images/medium.svg" alt="Medium" width="15" height="15"></a></li>
          <li><a href="https://instagram.com/miggle" aria-label="Instagram" target="_blank" rel="noopener"><img src="images/instagram_icon.svg" alt="Instagram" width="15" height="15"></a></li>
        </ul>
        <a href="/">← Back</a>
      </nav>
    </header>

    <main>
      <h1>Get in touch</h1>
      <p class="contact-intro">Email <a id="em" href="#">alick&#64;miggle&#46;one</a> or call <a href="tel:+447748188012">+44 (0) 7748 188012</a>, or use the form below.</p>

      <form class="contact-form" name="submit-to-google-sheet" novalidate>
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="Name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="Email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="phone">Phone <span class="optional">(optional)</span></label>
          <input type="tel" id="phone" name="Phone" autocomplete="tel">
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="form-submit">Send message</button>
      </form>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Miggle Ltd &middot; Company No. <a href="https://find-and-update.company-information.service.gov.uk/company/06200250">6200250</a></p>
    </footer>

  </div>

  <script>
    (function () {
      var e = document.getElementById('em');
      if (e) { e.href = 'mail' + 'to:' + 'alick' + '\x40' + 'miggle.one'; }
    }());
    (function () {
      var form = document.querySelector('form[name="submit-to-google-sheet"]');
      var endpoint = 'https://script.google.com/macros/s/AKfycbztmh6fw_sCMllJHfkYZY87dvYzIft1pCkgSDgztslVPp7cBBU/exec';
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Sending…';
        fetch(endpoint, { method: 'POST', body: new FormData(form) })
          .then(function () { window.location.href = 'formthanks.html'; })
          .catch(function () { window.location.href = 'formthanks.html'; });
      });
    }());
  </script>
