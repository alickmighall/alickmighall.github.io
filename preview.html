<title>Ravensmere CRM Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
/* Layout: staff app = sidebar + working area (super-basic dark); supporter-facing views = light Ravensmere-branded panels inside the same page. Single deliberate dark look. */
:root {
  --bg: #030712; --surface: #111827; --card: #1f2937; --line: #374151; --line2: #4b5563;
  --fg: #f3f4f6; --soft: #d1d5db; --muted: #9ca3af;
  --accent: #22d3ee; --accent-hi: #67e8f9; --btn: #0e7490; --btn-hi: #155e75; --accent-soft: #164e63;
  --warn: #fbbf24; --warn-bg: #78350f; --warn-ink: #fef3c7; --ok: #4ade80; --ok-bg: #14532d; --ok-ink: #dcfce7;
  --danger: #f87171; --danger-ink: #fca5a5; --info-bg: #1e3a8a; --info-ink: #dbeafe;
  --club: #0b0b0b; --club-ink: #0b0b0b; --sky: #9cc3e6; --sky-deep: #3b7fbf; --sky-tint: #e6f0fa; --paper: #ffffff; --ink: #111827; --ink-soft: #374151; --ink-muted: #4b5563; --paper-line: #e5e7eb; --paper-tint: #f3f4f6;
  --wp-side: #1d2327; --wp-bg: #f0f0f1; --wp-blue: #2271b1; --wp-line: #c3c4c7; --wp-ink: #1d2327; --wp-input: #8c8f94;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--muted); } .soft { color: var(--soft); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* demo bar */
.demobar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #0b1220; border-bottom: 1px solid var(--line); }
.demobar .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); font-weight: 700; margin-right: 4px; }
.demobar button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--soft); cursor: pointer; }
.demobar button[aria-pressed="true"] { background: var(--card); color: #fff; border-color: var(--accent); }
.demobar .spacer { flex: 1; }

/* shell */
.shell { display: flex; flex-wrap: wrap; align-content: flex-start; min-height: calc(100vh - 51px); }
.side { flex: 0 0 232px; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.badge-club { width: 36px; height: 36px; border-radius: 50%; background: var(--club); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.navlist { display: flex; flex-direction: column; gap: 2px; }
.navbtn { display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--soft); cursor: pointer; text-align: left; }
.navbtn:hover { background: #1a2333; }
.navbtn[aria-current="page"] { background: var(--card); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.pill { background: var(--btn); color: #fff; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
.main { flex: 999 1 560px; min-width: 0; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) { .main { padding-left: 32px; padding-right: 32px; } }
.menutoggle { display: none; }
@media (max-width: 860px) {
  .side { flex: 1 1 100%; flex-direction: column; align-items: stretch; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { justify-content: space-between; padding: 0; }
  .brand span.brand-sub { display: none; }
  .menutoggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  .navlist { display: none; }
  .navlist.open { display: flex; flex-direction: column; }
}
@media (max-width: 640px) {
  .demobar { flex-wrap: nowrap; overflow-x: auto; }
  .demobar .spacer { display: none; }
  .demobar button, .demobar .chip { white-space: nowrap; flex: none; }
}
.topbar { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 22px; }
.topctrls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.select, .input { background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 0 10px; color: var(--fg); }
.input.paper, .select.paper { background: #fff; color: var(--ink); border-color: #9ca3af; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #9333ea); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; color: #fff; }
.who { display: flex; align-items: center; gap: 8px; background: var(--line); border: 0; border-radius: 8px; padding: 4px 10px 4px 4px; min-height: 44px; color: var(--fg); cursor: pointer; text-align: left; flex: none; }
.who:hover { background: var(--line2); }

/* blocks */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { background: var(--surface); }
.card.hl { border-color: var(--accent); }
.card.warnbox { background: var(--surface); border-color: #b45309; }
.card h2 { font-size: 16px; } .card h3 { font-size: 15px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.kpi { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 13px; font-weight: 400; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip.accent { background: var(--accent-soft); color: #cffafe; }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); font-weight: 600; }
.chip.info { background: var(--info-bg); color: var(--info-ink); font-weight: 600; }
.chip.danger { background: #7f1d1d; color: #fee2e2; font-weight: 600; }
.btn { min-height: 42px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--btn); color: #fff; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--btn-hi); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--fg); font-weight: 400; }
.btn.ghost:hover { background: #1a2333; }
.btn.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: 500; }
.btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger-ink); font-weight: 500; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; border: 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.locknote { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--soft); font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px; width: fit-content; max-width: 100%; }
.tab { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--soft); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--line); color: #fff; font-weight: 600; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 8px; text-align: left; vertical-align: top; }
thead th { color: var(--muted); font-weight: 500; font-size: 13px; }
tbody tr { border-top: 1px solid var(--line); }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: #1a2333; }
tbody tr.sel { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.listrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.listrow:first-child { border-top: 0; }
details summary { cursor: pointer; }
.bar { height: 10px; background: var(--surface); border-radius: 999px; overflow: hidden; } .bar > div { height: 100%; background: var(--accent); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.steps li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--muted); font-size: 13px; }
.steps li[aria-current="step"] { background: var(--accent-soft); border-color: var(--accent); color: #fff; font-weight: 600; }
.rule { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.op { font-size: 12px; font-weight: 700; color: var(--accent-hi); }

/* typeahead */
.ta { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ta .lbl { font-size: 12px; color: var(--muted); }
.ta-list { position: absolute; z-index: 30; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.45); max-height: 280px; overflow-y: auto; }
.ta-opt { padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.ta-opt.hi { background: var(--accent-soft); color: #fff; }
.ta-empty { padding: 9px 10px; color: var(--muted); }

/* board */
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; min-width: 1060px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 240px; }
.col.over { border-color: var(--accent); background: #0f1d2b; }
.dcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; cursor: grab; }
.dcard[draggable="false"] { cursor: default; }
.dcard select { min-height: 30px; font-size: 12px; }

/* modal + toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(3,7,18,.72); display: flex; align-items: flex-start; justify-content: center; padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.dialog { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.dialog.danger { border-color: var(--danger); }
.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: #0b1220; border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

/* supporter-facing (light) */
.paperwrap { display: flex; justify-content: center; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { width: 390px; max-width: 100%; background: var(--paper); color: var(--ink); border-radius: 28px; border: 10px solid #1f2937; overflow: hidden; min-height: 760px; display: flex; flex-direction: column; }
.paper { background: var(--paper); color: var(--ink); }
.paper a, .paper .linkbtn { color: var(--club); }
.clubhead { background: var(--club); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.clubhead .badge-club { background: #111827; }
.ptabs { display: flex; border-bottom: 1px solid var(--paper-line); }
.ptab { flex: 1; min-height: 46px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; }
.ptab[aria-selected="true"] { color: var(--club); font-weight: 700; box-shadow: inset 0 -3px 0 var(--club); }
.pbody { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.pbtn { min-height: 48px; border-radius: 10px; border: 0; background: var(--club); color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; padding: 0 16px; }
.pbtn.line { background: #fff; border: 1px solid var(--club); color: var(--club); }
.pbtn.red { background: #fff; border: 1px solid #b91c1c; color: #b91c1c; }
.pbtn.plain { background: #fff; border: 1px solid var(--ink-soft); color: var(--ink); font-weight: 400; }
.pfield { border: 1px solid var(--paper-line); border-radius: 12px; margin: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.pfield legend { font-weight: 700; padding: 0 4px; }
.swrow { display: flex; align-items: center; justify-content: space-between; min-height: 40px; font-size: 15px; }
.swrow input { width: 22px; height: 22px; accent-color: var(--club); }
.mail { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
.mailhead { font-size: 13px; color: var(--soft); display: flex; flex-direction: column; gap: 2px; }
.mailbody { background: var(--paper); color: var(--ink); border-radius: 10px; overflow: hidden; }
.mailitem { border: 1px solid var(--paper-line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.emailprev { background: #e5e7eb; border-radius: 12px; padding: 20px; display: flex; justify-content: center; }
.emailprev .paper { width: 100%; max-width: 560px; border-radius: 8px; overflow: hidden; }
.emailprev.mobile .paper { max-width: 360px; }

/* club website: Touchline "Vardy"-style layout in Ravensmere's crest colours (sky blue, black, white) */
.sitewrap { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site { max-width: 1180px; margin: 0 auto; background: #fff; color: #111; border-radius: 10px; overflow: hidden; font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
.site a, .site .linkbtn { color: #111; }
.site h1, .site h2, .site h3, .site .cond { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
.utilbar { background: #0b0b0b; color: #fff; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; padding: 4px 16px; }
.utilbar button { background: none; border: 0; color: #fff; cursor: pointer; min-height: 30px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.sitehead2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; border-bottom: 1px solid #e5e7eb; background: #fff; }
.sitehead2 nav { flex: 1 1 420px; display: flex; flex-wrap: wrap; gap: 0 2px; }
.sitehead2 nav button { background: none; border: 0; border-bottom: 3px solid transparent; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; color: #111; min-height: 44px; padding: 0 10px; cursor: pointer; }
.sitehead2 nav button[aria-current="page"] { border-bottom-color: var(--sky-deep); }
.mainsponsor { border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 12px; background: #fff; cursor: pointer; color: #111; text-align: left; min-height: 44px; }
.mainsponsor small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #4b5563; }
.mainsponsor strong { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 17px; text-transform: uppercase; }
.pushbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--sky-tint); border-bottom: 1px solid #d1d5db; padding: 10px 20px; }
.herogrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 18px; padding: 20px; }
@media (max-width: 860px) { .herogrid { grid-template-columns: 1fr; } }
.feature { position: relative; border-radius: 8px; overflow: hidden; background: #0b0b0b; min-height: 320px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
.feature .photo { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #1f2937 0 16px, #111827 16px 32px); display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 13px; }
.feature .cap { position: relative; padding: 18px 20px; background: rgba(0,0,0,.78); display: flex; flex-direction: column; gap: 6px; }
.feature .cap h1 { font-size: 34px; line-height: 1.05; font-weight: 800; }
.kicker { display: inline-block; background: var(--sky); color: #0b0b0b; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 14px; padding: 2px 8px; border-radius: 3px; width: fit-content; }
.matchcol { display: flex; flex-direction: column; gap: 14px; }
.matchcard { border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; background: #fff; }
.matchcard .mh { display: flex; justify-content: space-between; gap: 8px; background: var(--sky); color: #0b0b0b; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.teamrow { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 19px; text-transform: uppercase; }
.teamrow .score { margin-left: auto; font-size: 22px; }
.oppcrest { width: 30px; height: 30px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #374151; flex: none; }
.mmeta { padding: 2px 12px; font-size: 13px; color: #374151; }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px 12px; }
.sbtn { background: #0b0b0b; color: #fff; border: 0; border-radius: 6px; min-height: 40px; padding: 0 14px; font-weight: 700; cursor: pointer; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; font-size: 15px; letter-spacing: .02em; }
.sbtn.light { background: var(--sky-tint); color: #0b0b0b; }
.sbtn:disabled { opacity: .45; cursor: not-allowed; }
.secthead { padding: 8px 20px 0; }
.secthead h2 { font-size: 32px; font-weight: 800; }
.secthead h2::after { content: ""; display: block; width: 44px; height: 4px; background: var(--sky-deep); margin-top: 4px; }
.newsgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 14px 20px 22px; }
.newscard { border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); background: #fff; display: flex; flex-direction: column; }
.newscard .thumb { height: 130px; background: repeating-linear-gradient(135deg, #dbe8f5 0 14px, #cfe0f1 14px 28px); display: flex; align-items: center; justify-content: center; color: #4b5563; font-size: 12px; }
.newscard .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.newscard h3 { font-size: 19px; font-weight: 800; line-height: 1.1; }
.newscard .meta { font-size: 12px; color: #4b5563; }
.partners { padding: 12px 20px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.sponsortile { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; min-height: 64px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 17px; text-transform: uppercase; color: #111; cursor: pointer; }
.sponsortile:hover { border-color: #0b0b0b; }
.newsband { background: var(--sky); color: #0b0b0b; padding: 24px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.newsband h2 { font-size: 30px; font-weight: 800; }

/* ---------- permissions ---------- */
function makeCan(S, role) {
  const r = USERS[role].role;
  const g = S.grants[role] || {};
  return function (cap) {
    if (r === 'owner' || r === 'partner') return true;
    if (cap === 'commercialEdit') return r === 'commercial';
    if (cap === 'values') return r === 'commercial' ? g.values !== false : !!g.values;
    if (['send','export','identity','integrations','rights'].includes(cap)) return !!g[cap];
    return false;
  };
}
function needsMfa(S, role) { const r = USERS[role].role; if (r === 'owner' || r === 'partner') return true; const g = S.grants[role] || {}; return RISKY.some((k) => g[k]); }

function Lock() { return html`<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>`; }
function Money({ can, n, suffix }) { return can('values') ? html`<span className="num">${fmt(n)}${suffix || ''}</span>` : html`<span className="muted" title="Needs the Commercial values permission"><${Lock}/> hidden</span>`; }
function LockNote({ children }) { return html`<div className="locknote"><${Lock}/><span>${children}</span></div>`; }

function Typeahead({ id, label, options, value, onPick, placeholder, paper, hideLabel }) {
  const [q, setQ] = useState(''); const [open, setOpen] = useState(false); const [hi, setHi] = useState(0);
  const sel = options.find((o) => o.value === value);
  const list = options.filter((o) => (o.label + ' ' + (o.meta || '')).toLowerCase().includes(q.toLowerCase())).slice(0, 8);
  const pick = (o) => { onPick(o.value); setQ(''); setOpen(false); };
  return html`<div className="ta">
    <label htmlFor=${id} className=${hideLabel ? 'sr' : 'lbl'}>${label}</label>
    <input id=${id} className=${'input' + (paper ? ' paper' : '')} role="combobox" aria-expanded=${open} aria-controls=${id + '-list'} aria-autocomplete="list" autoComplete="off"
      value=${open ? q : (sel ? sel.label : '')} placeholder=${placeholder || 'Type to search'}
      onFocus=${() => { setOpen(true); setQ(''); setHi(0); }} onBlur=${() => setTimeout(() => setOpen(false), 120)}
      onChange=${(e) => { setQ(e.target.value); setOpen(true); setHi(0); }}
      onKeyDown=${(e) => { if (e.key === 'ArrowDown') { e.preventDefault(); setHi((h) => Math.min(h + 1, list.length - 1)); } else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); } else if (e.key === 'Enter' && list[hi]) { e.preventDefault(); pick(list[hi]); } else if (e.key === 'Escape') { setOpen(false); } }} />
    ${open && html`<ul id=${id + '-list'} role="listbox" className="ta-list">
      ${list.length ? list.map((o, i) => html`<li key=${o.value} role="option" aria-selected=${i === hi} className=${'ta-opt' + (i === hi ? ' hi' : '')} onMouseDown=${(e) => { e.preventDefault(); pick(o); }}>${o.label}${o.meta ? html`<span className="muted"> · ${o.meta}</span>` : null}</li>`) : html`<li className="ta-empty">No matches</li>`}
    </ul>`}
  </div>`;
}

function Modal({ title, onClose, danger, children }) {
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  return html`<div className="overlay" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${'dialog' + (danger ? ' danger' : '')} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="row between"><h2 style=${{ fontSize: '18px' }}>${title}</h2><button className="btn ghost small" onClick=${onClose} aria-label="Close">Close</button></div>
      ${children}
    </div>
  </div>`;
}

/* ---------- Segments ---------- */
function Segments({ ctx }) {
  const { S, update, toast, audit, go, P } = ctx;
  const [name, setName] = useState('Lapsed season-ticket holders');
  const [nl, setNl] = useState('people who had a season ticket last year but not this year');
  const [rules, setRules] = useState([{ id: 'st', p: '2024/25', op: '' }]);
  const [purpose, setPurpose] = useState('tickets'); const [channel, setChannel] = useState('email');
  const [kind, setKind] = useState('Dynamic'); const [removed, setRemoved] = useState([]); const [added, setAdded] = useState([]);
  const catalogue = RULES.concat(S.uploadedSource ? [{ id: 'src', group: 'Uploaded sources', label: 'Is in source', params: ['Summer Fun Day raffle'] }] : []);
  const isLapsed = rules.length === 2 && rules[0].id === 'st' && rules[0].p === '2024/25' && rules[1].id === 'st' && rules[1].p === '2025/26' && rules[1].op === 'AND NOT';
  const hash = rules.map((r) => r.id + r.p + r.op).join('|').split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7);
  const matched = isLapsed ? 148 : rules.length === 1 && rules[0].id === 'st' ? (rules[0].p === '2024/25' ? 402 : 254) : 60 + hash % 500;
  const base = isLapsed && purpose === 'tickets' && channel === 'email';
  const noC = base ? 41 : Math.round(matched * (channel === 'email' ? 0.28 : channel === 'wa' ? 0.7 : 0.82));
  const excl = [
    ['no ' + CHANNELS.find((c) => c[0] === channel)[1].toLowerCase() + ' consent (or soft opt-in) for ' + PURPOSES.find((x) => x[0] === purpose)[1].toLowerCase(), noC, 'For example Tom Breward (opted out of email), and others'],
    ['minors', isLapsed ? 6 : Math.round(matched * 0.04), 'Junior season-ticket holders. Never marketed to.'],
    ['suppressed (unsubscribed or bounced)', channel === 'email' ? (isLapsed ? 3 : Math.round(matched * 0.02)) : 1, 'Unsubscribes, bounces and complaints'],
    ['age not known', isLapsed ? 9 : Math.round(matched * 0.06), 'Excluded until their age is confirmed'],
    ['pending erasure', S.rights.some((r) => r.status === 'hold') && isLapsed ? 0 : 0, 'People with an erasure on hold'],
    ['same address as another recipient', channel === 'email' ? (isLapsed ? 2 : Math.round(matched * 0.01)) : 0, 'Households sharing an inbox get one copy']
  ];
  const receive = Math.max(0, matched - excl.reduce((a, e) => a + e[1], 0) - removed.length + added.length);
  const sample = ['sarah','mark','jamie','nadia'].filter((id) => !removed.includes(id));
  const addOpts = ctx.visiblePeople.filter((p) => !sample.includes(p.id) && !added.includes(p.id) && p.age === 'adult').map((p) => ({ value: p.id, label: p.name, meta: p.email }));
  const setRule = (i, k, v) => setRules((rs) => rs.map((r, j) => j === i ? Object.assign({}, r, { [k]: v }, k === 'id' ? { p: catalogue.find((c) => c.id === v).params[0] } : {}) : r));
  return html`<div className="stack" style=${{ gap: '14px' }}>
    ${S.segments.length > 0 && html`<section className="card flat"><h2>Saved segments</h2>${S.segments.map((s) => html`<div className="listrow" key=${s.id}><span><strong>${s.name}</strong> <span className="muted">· ${PURPOSES.find((x) => x[0] === s.purpose)[1]} by ${CHANNELS.find((c) => c[0] === s.channel)[1].toLowerCase()} · ${s.kind}</span></span><span className="num">${s.receive} will receive</span></div>`)}</section>`}
    <section className="card"><h2>New segment</h2>
      <label className="field">Segment name<input className="input" style=${{ maxWidth: '520px' }} value=${name} onChange=${(e) => setName(e.target.value)} /></label>
      <label className="field">Describe who you want (optional)<div className="row"><input className="input" style=${{ flex: '1 1 320px' }} value=${nl} onChange=${(e) => setNl(e.target.value)} /><button className="btn outline" onClick=${() => { setRules([{ id: 'st', p: '2024/25', op: '' }, { id: 'st', p: '2025/26', op: 'AND NOT' }]); toast('Turned into 2 rules from the catalogue.'); }}>Turn into rules</button></div></label>
      <h3>Rules</h3>
      ${rules.map((r, i) => { const def = catalogue.find((c) => c.id === r.id); return html`<div key=${i} className="stack">
        ${i > 0 && html`<select aria-label="Combine with" className="select" style=${{ width: 'fit-content', minHeight: '32px' }} value=${r.op} onChange=${(e) => setRule(i, 'op', e.target.value)}><option>AND</option><option>OR</option><option>AND NOT</option></select>`}
        <div className="rule"><span className="muted">${def.group}</span>
          <select aria-label="Rule" className="select" value=${r.id} onChange=${(e) => setRule(i, 'id', e.target.value)}>${catalogue.map((c) => html`<option key=${c.id} value=${c.id}>${c.label}</option>`)}</select>
          <select aria-label="Value" className="select" value=${r.p} onChange=${(e) => setRule(i, 'p', e.target.value)}>${def.params.map((x) => html`<option key=${x}>${x}</option>`)}</select>
          ${rules.length > 1 && html`<button className="btn ghost small" onClick=${() => setRules((rs) => rs.filter((_, j) => j !== i))}>Remove</button>`}</div></div>`; })}
      <div className="row"><button className="btn ghost small" onClick=${() => setRules((rs) => [...rs, { id: 'att', p: '1 home game', op: 'AND' }])}>+ Add rule</button><span className="muted" style=${{ fontSize: '12px' }}>Catalogue: Behaviour · Demographics · Value${S.uploadedSource ? ' · Uploaded sources' : ''}</span></div>
      <div className="row">
        <label className="field">Purpose<select className="select" value=${purpose} onChange=${(e) => setPurpose(e.target.value)}>${PURPOSES.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></label>
        <label className="field">Channel<select className="select" value=${channel} onChange=${(e) => setChannel(e.target.value)}>${CHANNELS.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></label>
      </div>
    </section>
    <section className="card hl" aria-label="Count before list"><h2>Who will receive it</h2>
      <div className="listrow"><span>Matched the rules</span><strong className="num">${matched}</strong></div>
      ${excl.filter((e) => e[1] > 0).map((e) => html`<details key=${e[0]} style=${{ borderTop: '1px solid var(--line)' }}><summary className="row between" style=${{ padding: '9px 0', listStyle: 'none' }}><span className="soft">▸ Excluded: ${e[0]}</span><span className="num">−${e[1]}</span></summary><div className="muted" style=${{ padding: '0 0 9px 16px' }}>${e[2]}</div></details>`)}
      ${(removed.length || added.length) ? html`<div className="listrow"><span className="soft">Adjusted by hand</span><span className="num">${added.length - removed.length >= 0 ? '+' : ''}${added.length - removed.length}</span></div>` : null}
      <div className="listrow" style=${{ fontSize: '18px' }}><strong>Will receive</strong><strong className="num" style=${{ color: 'var(--accent-hi)' }}>${receive}</strong></div>
      <span className="muted" style=${{ fontSize: '12px' }}>Exclusions are applied for this purpose and channel, and can't be switched off.</span>
    </section>
    <section className="card"><div className="row between"><h2>Review the ${receive} people</h2><div style=${{ width: '280px', maxWidth: '100%' }}><${Typeahead} id="addperson" label="Add someone" options=${addOpts} value=${null} placeholder="Search by name" onPick=${(v) => { setAdded((a) => [...a, v]); toast(P(v).name + ' added.'); }} /></div></div>
      ${sample.concat(added).map((id) => html`<div className="listrow" key=${id}><span>${P(id).name} <span className="muted">· ${added.includes(id) ? 'added by hand' : 'season ticket 2024/25'}</span></span><button className="btn ghost small" aria-label=${'Remove ' + P(id).name} onClick=${() => added.includes(id) ? setAdded((a) => a.filter((x) => x !== id)) : setRemoved((r) => [...r, id])}>Remove</button></div>`)}
      <span className="muted">Showing ${sample.length + added.length} of ${receive}</span></section>
    <section className="row">
      <fieldset style=${{ border: 0, margin: 0, padding: 0 }} className="row"><legend className="soft" style=${{ marginBottom: '4px' }}>Save as</legend>
        <label className="row"><input type="radio" name="kind" checked=${kind === 'Dynamic'} onChange=${() => setKind('Dynamic')} /> Dynamic: re-check whenever it's used</label>
        <label className="row"><input type="radio" name="kind" checked=${kind === 'Snapshot'} onChange=${() => setKind('Snapshot')} /> Snapshot: freeze this list now</label></fieldset>
      <button className="btn" onClick=${() => { const sid = 'seg' + Date.now(); update((n) => { n.segments.unshift({ id: sid, name, purpose, channel, receive, kind }); audit(n, 'Saved segment: ' + name + ' (' + receive + ')'); }); toast('Segment saved: ' + name + '.', { label: 'Use in an email', fn: () => go({ view: 'messages', seg: sid }) }); }}>Save segment</button>
    </section>
  </div>`;
}

function useMoveDeal(ctx) {
  const { update, toast, audit, setModal, role, S } = ctx;
  const apply = (id, stage, extra) => {
    const before = structuredClone(S.deals.find((d) => d.id === id));
    const beforeInv = structuredClone(S.inventory);
    update((n) => {
      const d = n.deals.find((x) => x.id === id); const now = Date.now(); const last = d.history[d.history.length - 1];
      if (last && now - last.at < 5 * 60 * 1000 && last.by === USERS[role].name) { last.to = stage; last.at = now; } else d.history.push({ from: d.stage, to: stage, at: now, by: USERS[role].name });
      d.stage = stage; if (extra && extra.reason) d.lostReason = extra.reason;
      if (stage === 'won') { d.prob = 100; (d.items || []).forEach(([t, k]) => { n.inventory.find((i) => i.id === t).sold += k; }); n.orgs[d.org].status = 'Sponsor'; audit(n, 'Won: ' + n.orgs[d.org].name + ' (' + fmt(d.value) + '); contract and placements created'); }
    });
    const nm = S.orgs[before.org].name; const st = STAGES.find((s) => s[0] === stage)[1];
    toast(nm + ' moved to ' + st + '.', { label: 'Undo', fn: () => update((n) => { const i = n.deals.findIndex((x) => x.id === id); n.deals[i] = before; n.inventory = beforeInv; }) });
  };
  return (id, stage) => {
    const d = S.deals.find((x) => x.id === id); if (!d || d.stage === stage) return;
    const nm = S.orgs[d.org].name;
    if (stage === 'won') setModal(html`<${Modal} title=${'Mark ' + nm + ' as won?'} onClose=${() => setModal(null)}><p className="soft" style=${{ margin: 0 }}>This creates the contract (${fmt(d.value)}) and its placements: ${d.what}. Inventory updates straight away.</p><div className="row"><button className="btn" onClick=${() => { setModal(null); apply(id, 'won'); }}>Mark as won and create contract</button><button className="btn ghost" onClick=${() => setModal(null)}>Cancel</button></div><//>`);
    else if (stage === 'lost') setModal(html`<${LostReason} nm=${nm} close=${() => setModal(null)} done=${(r) => { setModal(null); apply(id, 'lost', { reason: r }); }} />`);
    else apply(id, stage);
  };
}
function LostReason({ nm, close, done }) {
  const [r, setR] = useState('');
  return html`<${Modal} title=${'Why was ' + nm + ' lost?'} onClose=${close}><label className="field">Reason (required)<select className="select" value=${r} onChange=${(e) => setR(e.target.value)}><option value="">Choose…</option><option>Price</option><option>Went with another club</option><option>No budget this season</option><option>No response</option><option>Other</option></select></label><div className="row"><button className="btn" disabled=${!r} onClick=${() => done(r)}>Mark as lost</button><button className="btn ghost" onClick=${close}>Cancel</button></div><//>`;

function Suggestions({ ctx }) {

  const s = S.suggestions.find((x) => x.id === sel);
  const act = (status) => {
    const prev = structuredClone(S);
    update((n) => { const x = n.suggestions.find((y) => y.id === s.id); x.status = status; if (status === 'merged') { const p = n.people.find((q) => q.id === s.a); p.sources.push(s.otherSrc.split(' ·')[0] + ' customer (' + s.otherName + ')'); if (p.id === 'dan') p.value.shop += 116; } audit(n, (status === 'merged' ? 'Merged ' : status === 'never' ? 'Marked never merge: ' : 'Rejected: ') + s.title); });
    toast(status === 'merged' ? 'Merged into one record: ' + P(s.a).name + '.' : status === 'never' ? 'Marked never merge.' : 'Marked as different people.', { label: status === 'merged' ? 'Undo merge' : 'Undo', fn: () => update((n) => { const x = n.suggestions.find((y) => y.id === s.id); x.status = 'open'; const p = n.people.find((q) => q.id === s.a); const pp = prev.people.find((q) => q.id === s.a); p.sources = pp.sources; p.value = pp.value; audit(n, 'Undid decision: ' + s.title); }) });
  };
  return html`<div className="row" style=${{ alignItems: 'flex-start', gap: '14px' }}>
    <section className="card" style=${{ flex: '1 1 280px', padding: 0, gap: 0, overflow: 'hidden' }} aria-label="Suggestions">

      ${open.map((x) => html`<button key=${x.id} onClick=${() => setSel(x.id)} style=${{ display: 'flex', flexDirection: 'column', gap: '3px', textAlign: 'left', padding: '12px 14px', border: 0, borderTop: '1px solid var(--line)', background: x.id === sel ? 'var(--surface)' : 'transparent', boxShadow: x.id === sel ? 'inset 3px 0 0 var(--accent)' : 'none', cursor: 'pointer', color: 'var(--fg)' }}><span className="row between"><strong>${x.title}</strong><span style=${{ color: 'var(--accent-hi)' }}>${x.conf}%</span></span><span className="muted" style=${{ fontSize: '12px' }}>${x.why}</span></button>`)}
      <div style=${{ padding: '12px 14px', borderTop: '1px solid var(--line)' }} className="muted">${S.extraSuggestions} more, lower priority</div>
    </section>
    <section className="card" style=${{ flex: '2 1 460px' }}>
      ${s && s.status === 'open' ? html`
        <h2 style=${{ fontSize: '18px' }}>Is ${s.otherName} the same person as ${P(s.a).name}?</h2>
        <div className="grid" style=${{ gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))' }}>
          <div className="card flat" style=${{ padding: '12px' }}><strong>${P(s.a).name}</strong><span className="muted">${P(s.a).sources.join(' · ')}</span><span>${P(s.a).email}</span></div>
          <div className="card flat" style=${{ padding: '12px' }}><strong>${s.otherName}</strong><span className="muted">${s.otherSrc}</span><span>${s.otherEmail}</span></div>
        </div>
        <div className="stack"><strong>Evidence · confidence ${s.conf}%</strong><span className="soft">${s.evidence}</span><span className="soft">Merging links ${s.links} older record to ${P(s.a).name}.</span></div>
        ${can('identity') ? html`<div className="row"><button className="btn" onClick=${() => act('merged')}>Merge</button><button className="btn ghost" onClick=${() => act('rejected')}>Not the same person</button><button className="btn ghost" onClick=${() => act('never')}>Never merge</button></div>` : html`<${LockNote}>You can see suggestions but not act on them. Ask your club owner for the Identity permission.<//>`}

}

function CancelErasure({ ctx, r, close }) {
  const { update, toast, audit, P } = ctx; const [why, setWhy] = useState(''); const [ex, setEx] = useState('');
  const reasons = [['withdrawn', P(r.person).name.split(' ')[0] + ' withdrew the request'],['unverified', "The request wasn't verified, or was fraudulent"],['error', 'It was made in error (for example, the wrong person was selected)'],['legal', 'A legal exemption applies']];
  const label = { withdrawn: 'withdrawn by the requester', unverified: 'not verified', error: 'made in error', legal: 'legal exemption (' + ex + ')' };
  return html`<${Modal} title=${'Cancel ' + P(r.person).name + "'s erasure?"} onClose=${close} danger=${true}>
    <fieldset style=${{ border: 0, margin: 0, padding: 0 }} className="stack"><legend className="soft" style=${{ marginBottom: '6px' }}>Reason (required)</legend>
      ${reasons.map(([k, l]) => html`<label className="row" key=${k}><input type="radio" name="why" checked=${why === k} onChange=${() => setWhy(k)} /> ${l}</label>`)}</fieldset>
    ${why === 'legal' && html`<label className="field">Name the exemption<input className="input" value=${ex} onChange=${(e) => setEx(e.target.value)} placeholder="For example: needed for a legal claim" /></label>`}
    <p className="muted" style=${{ margin: 0 }}>You can't cancel because the club would like to keep the data. ${P(r.person).name.split(' ')[0]} will be told.</p>
    <div className="row"><button className="btn" disabled=${!why || (why === 'legal' && !ex)} onClick=${() => { update((n) => { const x = n.rights.find((y) => y.id === r.id); x.status = 'cancelled'; x.reason = label[why]; n.people.find((p) => p.id === r.person).status = 'active'; audit(n, 'Cancelled erasure for ' + P(r.person).name + ': ' + label[why]); }); close(); toast('Erasure cancelled. ' + P(r.person).name.split(' ')[0] + ' has been told.'); }}>Cancel erasure</button><button className="btn ghost" onClick=${close}>Keep the erasure</button></div>
  <//>`;
}

          <section className="matchcard" aria-label="Latest result"><div className="mh"><span>Men's First Team</span><span>Latest result</span></div>

            <div className="teamrow"><span className="oppcrest" aria-hidden="true">MA</span>Marden Athletic<span className="score">2</span></div>
            <div className="mmeta">Southern Counties League · Sat 25 October</div>
            <div className="mbtns"><button className="sbtn light" onClick=${() => toast('Match report (prototype).')}>Report</button></div></section>
        </div>
      </div>
      <div className="secthead"><h2>Latest</h2></div>
      <div className="newsgrid">${news.map(([k, t, w]) => html`<article className="newscard" key=${t}><div className="thumb" aria-hidden="true">[Photo]</div><div className="body"><span className="kicker" style=${{ fontSize: '12px' }}>${k}</span><h3>${t}</h3><span className="meta">${w}</span></div></article>`)}</div>
      <div className="secthead"><h2>Next home matches</h2></div>
      <div className="newsgrid">${homes.map(([team, opp, d, t, ini]) => html`<section className="matchcard" key=${team}><div className="mh"><span>${team}</span><span>${d}</span></div><div className="teamrow" style=${{ paddingTop: '10px' }}><${Crest} size=${30} />Ravensmere Town FC<span className="score" style=${{ fontSize: '16px' }}>${t}</span></div><div className="teamrow"><span className="oppcrest" aria-hidden="true">${ini}</span>${opp}</div><div className="mbtns"><button className="sbtn" onClick=${() => toast('Tickets open on TicketCo (prototype).')}>Tickets</button></div></section>`)}</div>
    </div>`}
    <div className="secthead"><h2>Our partners</h2></div>
    <div className="partners" aria-label="Our partners">${sponsors.map((id) => html`<button key=${id} className="sponsortile" onClick=${() => clickSponsor(id)}>${S.orgs[id].name}</button>`)}</div>
    <p style=${{ margin: '0 20px 18px', fontSize: '12px', color: '#4b5563' }}>(Prototype) Each page view counts an impression for every sponsor shown, and clicks are recorded for the sponsor value view. Nair & Co so far: ${S.web.impressions.toLocaleString('en-GB')} impressions, ${S.web.clicks} clicks.</p>
    <section className="newsband">
      <div className="stack"><h2>Get the club newsletter</h2><span>News, match previews and offers from Ravensmere Town FC, straight to your inbox.</span></div>
      <form className="stack" onSubmit=${submit} aria-label="Newsletter sign-up">
        <label className="stack" style=${{ gap: '4px', fontWeight: 600 }}>Your name<input id="nl-name" type="text" value=${name} onChange=${(e) => setName(e.target.value)} required /></label>
        <label className="stack" style=${{ gap: '4px', fontWeight: 600 }}>Email<input id="nl-email" type="email" value=${email} onChange=${(e) => setEmail(e.target.value)} placeholder="you@example.com" required /></label>
        <label className="stack" style=${{ gap: '4px', fontWeight: 600 }}>Postcode<input id="nl-pc" type="text" value=${pc} onChange=${(e) => setPc(e.target.value)} /></label>
        <label className="row" style=${{ alignItems: 'flex-start' }}><input id="nl-tick" type="checkbox" checked=${tick} onChange=${(e) => setTick(e.target.checked)} style=${{ width: '20px', height: '20px', marginTop: '2px', accentColor: '#0b0b0b' }} /><span>${form.wording || 'Keep me updated.'}</span></label>
        <button className="sbtn" type="submit" style=${{ alignSelf: 'flex-start' }} disabled=${!tick || !name.trim() || !email.trim()}>Sign up</button></form>
    </section>
    <footer className="sitefoot2"><div className="row"><${Crest} size=${48} /><div className="stack" style=${{ gap: 0 }}><strong className="cond" style=${{ fontSize: '20px' }}>Ravensmere Town FC</strong><span style=${{ color: '#d1d5db' }}>Mere Lane · an invented club</span></div></div>
      <div className="row"><button onClick=${() => setPage('prefs') || ctx.track('Website · My preferences')}>My preferences</button><button onClick=${() => toast('Privacy notice (prototype).')}>Privacy</button><button onClick=${() => toast('Cookie settings (prototype).')}>Cookies</button></div>
      <span style=${{ color: '#d1d5db', fontSize: '12px' }}>Mock-up of a Touchline-style club website</span></footer>
  </div></div>`;
}

/* ---------- WordPress admin: the CRM plugin's settings page ---------- */
function WpAdmin({ ctx }) {
  const { S, update, toast, audit, role, wpView, setWpView, wpUser, setWpUser } = ctx;
  const WPU = { sam: 'Sam Patel · Administrator', touchline: 'Touchline · Administrator', chris: 'Chris Oduya · Editor', alex: 'Alex Kent · Author (news only)' };
  const isAdmin = wpUser === 'sam' || wpUser === 'touchline'; const crmUser = wpUser !== 'alex';
  const showPosts = !crmUser || (wpView === 'settings' && !isAdmin) || wpView === 'posts';
  const [tab, setTab] = useState('forms'); const [open, setOpen] = useState('volunteer'); const [cred, setCred] = useState('');
  const setForm = (id, k, v) => update((n) => { n.wp.forms.find((x) => x.id === id)[k] = v; });
  const purposes = [['news','Club news'],['tickets','Ticket offers'],['sponsor','Sponsor offers'],['fundraising','Fundraising'],['surveys','Surveys'],['enquiry','Not marketing: enquiries only']];
  const crmFields = ['Name','Email','Phone','Postcode','Source fact: volunteer roles','Not sent'];
  const pub = { nair: true, coop: true, weald: false, lambert: false, plough: true, dental: false };
  const tabs = [['connection','Connection'],['forms','Forms'],['blocks','Blocks'],['sponsors','Sponsors'],['health','Health']];
  return html`<div className="wp">
    <div className="wptop"><span>WordPress · Ravensmere Town FC</span><label className="row" style=${{ gap: '6px' }}>Logged into WordPress as<select value=${wpUser} onChange=${(e) => { const v = e.target.value; setWpUser(v); if (v !== 'alex') ctx.setRole(v); setWpView(v === 'sam' || v === 'touchline' ? wpView : (v === 'alex' ? 'posts' : 'crm')); }}>${Object.entries(WPU).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></label></div>
    <aside className="wpside" aria-label="WordPress admin menu">
      <span>Dashboard</span>
      <button className=${wpView === 'posts' ? 'on' : ''} onClick=${() => setWpView('posts')}>Posts</button>
      ${['Media','Pages','Comments'].map((l) => html`<span key=${l}>${l}</span>`)}
      ${crmUser && html`<button className=${wpView === 'crm' ? 'on' : ''} onClick=${() => { setWpView('crm'); ctx.setNav({ view: 'home' }); update((n) => { n.flags.wpCrm = true; audit(n, 'Signed in to the CRM through WordPress (ravensmerefc site)', USERS[role].name); }); }}>Club CRM</button>`}
      ${['Appearance','Plugins'].map((l) => html`<span key=${l}>${l}</span>`)}
      ${isAdmin && html`<button className=${wpView === 'settings' ? 'on' : ''} onClick=${() => setWpView('settings')}>CRM plugin settings</button>`}
      <span>Settings</span>
    </aside>
    ${showPosts ? html`<main className="wpmain">
      <h1 style=${{ fontSize: '23px', fontWeight: 400 }}>Posts</h1>
      <div className="wpbox"><div className="row between"><strong>Preview: Lewes Road at Mere Lane</strong><span style=${{ color: '#50575e' }}>Draft · ${WPU[wpUser].split(' ·')[0]}</span></div><div className="row between"><span>Report: Ravensmere Town FC 0–2 Marden Athletic</span><span style=${{ color: '#50575e' }}>Published · 25 Oct</span></div><button className="wpbtn" style=${{ alignSelf: 'flex-start' }} onClick=${() => toast('Post saved (prototype).')}>Add new post</button></div>
      ${!crmUser && html`<div className="wpnote warn">Alex can write news here, but isn't a CRM user, so there's no Club CRM menu and no supporter data anywhere in WordPress. WordPress roles never give CRM access: the club owner would invite Alex in the CRM (Settings, Users and permissions) if they needed it.</div>`}
      ${crmUser && !isAdmin && wpView === 'settings' && html`<div className="wpnote">Only WordPress administrators can change the CRM plugin settings.</div>`}
    </main>` : wpView === 'crm' ? html`<main className="wpmain" style=${{ padding: 0, gap: 0 }}>
      <div className="wpnote ok" style=${{ margin: '12px 16px' }}>Signed in to the Ravensmere Town FC CRM as ${USERS[role].name} through WordPress, with no second login. Your CRM role and permissions apply${needsMfa(S, role) ? ', and the CRM still asks for your second sign-in step before risky actions such as sending' : ''}. No CRM data is stored in WordPress. WordPress users who aren't CRM staff don't see this menu.</div>
      <div style=${{ background: 'var(--bg)', color: 'var(--fg)', colorScheme: 'dark' }}><${Staff} ctx=${ctx} /></div>
    </main>` : html`<main className="wpmain">
      <h1 style=${{ fontSize: '23px', fontWeight: 400 }}>CRM plugin settings</h1>
      <div className="wpnote">Everything about supporters, segments, sponsors and sending is managed in the CRM. This page only connects the site and chooses what it sends. No supporter data is stored or shown here.</div>
      <div className="wptabs" role="tablist" aria-label="Plugin settings">${tabs.map(([id, l]) => html`<button key=${id} className="wptab" role="tab" aria-selected=${tab === id} onClick=${() => setTab(id)}>${l}</button>`)}</div>
      ${tab === 'connection' && html`<section className="wpbox"><div className="wpnote ok"><strong>Connected to Ravensmere Town FC.</strong> Credential created 2 Sep by Touchline. It is never shown again.</div>
        <label className="stack" style=${{ gap: '4px', maxWidth: '520px' }}>Replace the credential (paste the new one from the CRM)<input className="wpinput" type="password" value=${cred} onChange=${(e) => setCred(e.target.value)} placeholder="Paste credential" /></label>
        <div className="row"><button className="wpbtn" disabled=${!cred} onClick=${() => { setCred(''); update((n) => audit(n, 'WordPress plugin credential replaced', 'Touchline (WordPress admin)')); toast('Credential replaced. Still connected to Ravensmere Town FC.'); }}>Save credential</button></div></section>`}
      ${tab === 'forms' && html`<section className="wpbox"><p style=${{ margin: 0 }}>Choose which of this site's forms send submissions to the CRM. A form that isn't connected sends nothing.</p>
        <div className="tablewrap"><table style=${{ minWidth: '600px' }}><thead><tr><th>Form</th><th>Form tool</th><th>Sends to the CRM</th><th>Purpose</th><th></th></tr></thead><tbody>
          ${S.wp.forms.map((f) => html`<tr key=${f.id}><td><strong>${f.name}</strong></td><td>Site form <span style=${{ color: '#50575e', fontSize: '12px' }}>(tools to confirm, Q15)</span></td><td>${f.feed ? html`<span style=${{ color: '#00a32a', fontWeight: 600 }}>Yes</span>` : 'No'}</td><td>${purposes.find((x) => x[0] === f.purpose)[1]}</td><td><button className="wpbtn sec" onClick=${() => setOpen(open === f.id ? '' : f.id)}>${open === f.id ? 'Close' : 'Edit'}</button></td></tr>`)}
        </tbody></table></div>
        ${S.wp.forms.filter((f) => f.id === open).map((f) => { const marketing = f.purpose !== 'enquiry'; const ok = !f.feed || !marketing || f.wording.trim(); return html`<div key=${f.id} className="wpbox" style=${{ background: '#f6f7f7' }}>
          <strong>${f.name}</strong>
          <label className="row"><input type="checkbox" checked=${f.feed} onChange=${(e) => setForm(f.id, 'feed', e.target.checked)} /> Send submissions to the Ravensmere Town FC CRM</label>
          <label className="stack" style=${{ gap: '4px', maxWidth: '360px' }}>Purpose<select className="wpinput" value=${f.purpose} onChange=${(e) => setForm(f.id, 'purpose', e.target.value)}>${purposes.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></label>
          ${marketing && html`<label className="stack" style=${{ gap: '4px' }}>Consent wording supporters see next to the tick box (stored with every submission)<textarea className="wpinput" value=${f.wording} onChange=${(e) => setForm(f.id, 'wording', e.target.value)} placeholder="For example: Email me about volunteering at Ravensmere Town FC. You can unsubscribe at any time."></textarea></label>`}
          <div className="stack" style=${{ gap: '6px' }}><strong style=${{ fontSize: '13px' }}>Field mapping</strong>${f.fields.map(([ff, cf], i) => html`<label className="row" key=${ff}><span style=${{ minWidth: '200px' }}>${ff}</span><select className="wpinput" value=${cf} onChange=${(e) => update((n) => { n.wp.forms.find((x) => x.id === f.id).fields[i][1] = e.target.value; })}>${crmFields.map((c) => html`<option key=${c}>${c}</option>`)}</select></label>`)}<span style=${{ fontSize: '12px', color: '#50575e' }}>Unmapped fields ("Not sent") never leave the site.</span></div>
          ${!ok && html`<div className="wpnote warn">Add the consent wording supporters see before connecting a marketing form.</div>`}
          <div className="row"><button className="wpbtn" disabled=${!ok} onClick=${() => { update((n) => audit(n, 'WordPress plugin: ' + f.name + (f.feed ? ' connected (' + purposes.find((x) => x[0] === f.purpose)[1].toLowerCase() + ')' : ' not connected'), 'Touchline (WordPress admin)')); toast('Saved ' + f.name + '.' + (f.feed ? ' New submissions will reach the CRM.' : ' It sends nothing to the CRM.')); }}>Save changes</button></div>
        </div>`; })}
      </section>`}
      ${tab === 'blocks' && html`<section className="wpbox"><p style=${{ margin: 0 }}>Add these to pages with the block editor, or paste the shortcode.</p><div className="tablewrap"><table style=${{ minWidth: '560px' }}><thead><tr><th>Block</th><th>Shortcode</th><th>What it shows</th></tr></thead><tbody>
        <tr><td><strong>Miggle: Newsletter sign-up</strong></td><td><code>[miggle_crm_signup form="newsletter"]</code></td><td>The sign-up form, with its consent wording</td></tr>
        <tr><td><strong>Miggle: Supporter portal</strong></td><td><code>[miggle_crm_portal]</code></td><td>Sign-in, preferences, family and data rights</td></tr>
        <tr><td><strong>Miggle: Sponsor strip</strong></td><td><code>[miggle_crm_sponsors]</code></td><td>Sponsor logos, counting impressions and clicks</td></tr></tbody></table></div></section>`}
      ${tab === 'sponsors' && html`<section className="wpbox"><p style=${{ margin: 0 }}>Sponsors appear in the strip automatically. Public figures (such as impressions) show only for sponsors who agreed. That is set in the CRM.</p>${Object.entries(pub).map(([id, on]) => html`<div className="row between" key=${id} style=${{ borderTop: '1px solid #dcdcde', paddingTop: '8px' }}><span>${S.orgs[id].name}</span><span style=${{ color: on ? '#00a32a' : '#50575e' }}>${on ? 'Public figures shown' : 'Logo only'}</span></div>`)}</section>`}
      ${tab === 'health' && html`<section className="wpbox"><div className="wpnote ok">Last submission reached the CRM: ${S.wp.last}. No failures this week.</div><p style=${{ margin: 0 }}>If submissions fail, Miggle and Touchline are told first. The club is only asked to act if it needs to.</p></section>`}
    </main>`}</div>`;
}

const DEFAULT_WORDING = 'Send me club news from Ravensmere Town FC by email. You can unsubscribe at any time.';
function Tasks() { return null; }
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
